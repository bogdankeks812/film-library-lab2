spring.application.name=film-library

# Встроенная база данных H2 (хранит данные в памяти, пока работает приложение)
spring.datasource.url=jdbc:h2:mem:filmlibrary
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate сам создаёт таблицы по сущностям при запуске
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Веб-консоль H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Не держать сессию БД открытой во время формирования ответа
spring.jpa.open-in-view=false
